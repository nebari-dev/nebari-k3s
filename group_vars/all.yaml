---
k3s_version: v1.30.2+k3s2
ansible_user: vagrant

# interface which will be used for flannel
flannel_iface: eth1 # (vagrant uses eth1)

# enable kube-vip ARP broadcasts
kube_vip_arp: true

# apiserver_endpoint is virtual ip-address which will be configured on each master
apiserver_endpoint: 192.168.10.222

# k3s_token is required  masters can talk together securely
# this token should be alpha numeric only
k3s_token: some-secret-password

# change these to your liking, the only required are: --disable servicelb, --tls-san {{ apiserver_endpoint }}
extra_server_args: >-
  --tls-san {{ apiserver_endpoint }}
  --disable servicelb
  --disable traefik
  --write-kubeconfig-mode {{ k3s_write_kubeconfig_mode | default('0600') }}
  --flannel-iface={{ flannel_iface }}

extra_agent_args: >-
  --flannel-iface=eth1

server_init_args: >-
  {% if groups['master'] | length > 1 %}
    {% if inventory_hostname == groups['master'][0] %}
      --cluster-init
    {% else %}
      --server https://{{ master_ip | default('') }}:6443
    {% endif %}
    --token {{ k3s_token }}
  {% endif %}
  {{ extra_server_args }}

# image tag for kube-vip
kube_vip_tag_version: v0.8.2
# metallb type frr or native
metal_lb_type: native
# metallb mode layer2 or bgp
metal_lb_mode: layer2

# image tag for metal lb
metal_lb_speaker_tag_version: v0.14.8
metal_lb_controller_tag_version: v0.14.8

# metallb ip range for load balancer
metal_lb_ip_range: 192.168.10.191-192.168.10.199

# --- Cluster network policy ---
k3s_node_cidrs:
  - 10.11.0.0/24           # Internal cluster network (eth1)
  - 146.165.240.0/21       # External network (eth0) - adjust to match your needs

k3s_admin_cidrs:
  - 10.11.0.0/24           # Internal admin access
  - 146.165.243.211/32     # Specific admin host
  - 146.165.243.212/32     # Specific admin host
  # Add your bastion/VPN IPs here

# Expose ingress to the world?
k3s_expose_ingress_publicly: true
k3s_ingress_allowed_cidrs: []  # if public=true, optionally restrict to these CIDRs

# NodePort security settings
k3s_expose_nodeports_publicly: false  # Block NodePorts from public by default
k3s_allow_nodeports_from_admin: true  # Allow admin CIDRs to access NodePorts

# Flannel backend: vxlan => 8472/udp, wireguard => 51820(/51821) udp
k3s_flannel_backend: vxlan
k3s_enable_ipv6: false

# Components toggles
k3s_enable_metallb: true
k3s_enable_kubelet_metrics: true
k3s_enable_embedded_etcd: true   # relevant when >1 master

# Kubeconfig permissions
k3s_write_kubeconfig_mode: "0600"

# Hardening
k3s_enable_secrets_encryption: true

k3s_allow_deprecated_schema1_images: false

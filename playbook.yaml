---
- hosts: k3s_cluster
  become: true
  roles:
    - role: common

- hosts: master
  become: true
  gather_facts: true
  serial: 1
  roles:
    - role: k3s_master
    - role: post_master

- hosts: node
  become: true
  roles:
    - role: k3s_worker

# Label nodes for Nebari node groups based on inventory group membership.
# Put hosts in the [general] / [user] / [worker] inventory groups; each becomes a
# node-role.nebari.io/group=<group> label. Runs last so all nodes have joined.
# Run standalone with: --tags labels
- name: Label nodes for Nebari node groups
  hosts: k3s_cluster
  gather_facts: false
  become: true
  tags: labels
  tasks:
    - name: Apply node-role.nebari.io/group label from inventory group membership
      ansible.builtin.command: >-
        {{ k3s_binary_path | default('k3s') }} kubectl label node {{ inventory_hostname }}
        node-role.nebari.io/group={{ item }} --overwrite
      loop: "{{ nebari_node_groups | default(['general', 'user', 'worker']) }}"
      when:
        - item in groups
        - inventory_hostname in groups[item]
      delegate_to: "{{ groups['master'][0] }}"
      register: label_result
      changed_when: "'not labeled' not in label_result.stdout"

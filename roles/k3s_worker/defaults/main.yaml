k3s_token: some-secret-password

# Pin the k3s version installed on the agent (INSTALL_K3S_VERSION). Keep in sync
# with the master's k3s_version. Override via group_vars.
k3s_version: v1.30.2+k3s2

# Interface for flannel on the agent. Falls back to eth1 (vagrant default) unless
# flannel_iface is set via group_vars/inventory.
flannel_iface: eth1

extra_agent_args: >-
  --flannel-iface={{ flannel_iface }}

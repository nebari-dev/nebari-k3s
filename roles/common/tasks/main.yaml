- name: Network prep (facts + validation)
  ansible.builtin.include_tasks: network_prep.yaml

- name: Secure firewall policy
  ansible.builtin.include_tasks: firewall_secure.yaml

# https://infotechys.com/install-a-kubernetes-cluster-on-rhel-9/

# =====================================================================
# Step 1: Install Kernel Headers
# =====================================================================
- name: Install kernel headers (kernel-devel) for current kernel
  ansible.builtin.package:
    name: "kernel-devel-{{ ansible_kernel }}"
    state: present
  when: ansible_os_family == "RedHat"

# =====================================================================
# Step 2: Add / Load Kernel Modules for Kubernetes
# =====================================================================
- name: Create modules-load file for Kubernetes
  ansible.builtin.copy:
    dest: /etc/modules-load.d/kubernetes.conf
    content: |
      br_netfilter
      ip_vs
      ip_vs_rr
      ip_vs_wrr
      ip_vs_sh
      overlay
    mode: '0644'
  when: ansible_os_family == "RedHat"

- name: Load required kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - br_netfilter
    - ip_vs
    - ip_vs_rr
    - ip_vs_wrr
    - ip_vs_sh
    - overlay
  when: ansible_os_family == "RedHat"

# Install nfs-common package for NFS storage mounting
- name: Install nfs-common package
  ansible.builtin.package:
    name: nfs-utils
    state: present
  when: ansible_os_family == "RedHat"

# =====================================================================
# Step 3: Configure Sysctl
# =====================================================================
- name: Create sysctl config for Kubernetes
  ansible.builtin.copy:
    dest: /etc/sysctl.d/kubernetes.conf
    content: |
      net.ipv4.ip_forward = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.bridge.bridge-nf-call-iptables = 1
    mode: '0644'
  when: ansible_os_family == "RedHat"

- name: Reload sysctl settings
  ansible.builtin.command: sysctl --system
  when: ansible_os_family == "RedHat"

# =====================================================================
# (Optional) Disable SELinux
# =====================================================================
# - name: Set SELinux to disabled state
#   ansible.posix.selinux:
#     state: disabled
#   when: ansible_os_family == "RedHat"

# =====================================================================
# (Optional) Steps 5: Install and Configure Containerd
#   (commented out for brevity)
# =====================================================================

# =====================================================================
# Step 6: Firewall Rules are Now Managed by firewall_secure.yaml
# =====================================================================
# All firewall rules have been moved to roles/common/tasks/firewall_secure.yaml
# This provides centralized, secure, zone-based firewall configuration

# Remove these old overly-permissive rules:
# - Open HTTP and HTTPS ports in Firewalld
# - Open Kubernetes-related ports in Firewalld (TCP/UDP)
# These are now properly restricted in firewall_secure.yaml

# ---------------------------------------------------------------------
# Pod and Service subnets are now managed in firewall_secure.yaml
# ---------------------------------------------------------------------

- name: Optionally enable deprecated containerd schema1 pulling
  ansible.builtin.lineinfile:
    path: /etc/environment
    regexp: '^CONTAINERD_ENABLE_DEPRECATED_PULL_SCHEMA_1_IMAGE='
    line: 'CONTAINERD_ENABLE_DEPRECATED_PULL_SCHEMA_1_IMAGE=1'
    create: yes
    state: present
  when: ansible_os_family == "RedHat" and (k3s_allow_deprecated_schema1_images | bool)

---
# =============================================================================
# DEBIAN/UBUNTU UFW FIREWALL RULES
# =============================================================================
- name: Install UFW (Debian)
  ansible.builtin.package:
    name: ufw
    state: present
  when: ansible_os_family == "Debian"

- name: Enable UFW and deny incoming by default
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
  when: ansible_os_family == "Debian"

- name: Allow SSH only from admin CIDRs (Debian)
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
    port: "22"
    proto: tcp
  loop: "{{ k3s_admin_cidrs }}"
  when: ansible_os_family == "Debian" and (k3s_admin_cidrs | length) > 0

- name: Allow SSH from all (fallback if no admin CIDRs defined)
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
  when: ansible_os_family == "Debian" and (k3s_admin_cidrs | length) == 0

# --- K3s API: TCP only, and restricted ---
- name: Allow API (6443/tcp) from node CIDRs
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
    to_port: "6443"
    proto: tcp
  loop: "{{ k3s_node_cidrs }}"
  when: ansible_os_family == "Debian"

- name: Allow API (6443/tcp) from admin CIDRs
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
    to_port: "6443"
    proto: tcp
  loop: "{{ k3s_admin_cidrs }}"
  when: ansible_os_family == "Debian" and (k3s_admin_cidrs | length) > 0

# --- MetalLB memberlist: node-to-node only ---
- name: Allow MetalLB memberlist (7946/tcp+udp) node-to-node
  community.general.ufw:
    rule: allow
    from_ip: "{{ item.0 }}"
    to_port: "7946"
    proto: "{{ item.1 }}"
  loop: "{{ k3s_node_cidrs | product(['tcp','udp']) | list }}"
  when: ansible_os_family == "Debian" and (k3s_enable_metallb | bool)

# --- Flannel backend ports: node-to-node only ---
- name: Allow flannel vxlan (8472/udp) node-to-node
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
    to_port: "8472"
    proto: udp
  loop: "{{ k3s_node_cidrs }}"
  when: ansible_os_family == "Debian" and (k3s_flannel_backend == "vxlan")

- name: Allow flannel wireguard (51820/udp) node-to-node
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
    to_port: "51820"
    proto: udp
  loop: "{{ k3s_node_cidrs }}"
  when: ansible_os_family == "Debian" and (k3s_flannel_backend == "wireguard")

- name: Allow flannel wireguard IPv6 (51821/udp) node-to-node
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
    to_port: "51821"
    proto: udp
  loop: "{{ k3s_node_cidrs }}"
  when: ansible_os_family == "Debian" and (k3s_flannel_backend == "wireguard") and (k3s_enable_ipv6 | bool)

# --- Kubelet metrics: node-to-node only (optional) ---
- name: Allow kubelet metrics (10250/tcp) node-to-node
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
    to_port: "10250"
    proto: tcp
  loop: "{{ k3s_node_cidrs }}"
  when: ansible_os_family == "Debian" and (k3s_enable_kubelet_metrics | bool)

# --- Optional public ingress ---
- name: Allow ingress 80/443 if public exposure is enabled (unrestricted)
  community.general.ufw:
    rule: allow
    to_port: "{{ item }}"
    proto: tcp
  loop: ["80","443"]
  when: ansible_os_family == "Debian"
        and (k3s_expose_ingress_publicly | bool)
        and (k3s_ingress_allowed_cidrs | length == 0)

- name: Allow ingress 80/443 only from allowed CIDRs
  community.general.ufw:
    rule: allow
    from_ip: "{{ pair.0 }}"
    to_port: "{{ pair.1 }}"
    proto: tcp
  loop: "{{ k3s_ingress_allowed_cidrs | product(['80','443']) | list }}"
  loop_control:
    loop_var: pair
  when: ansible_os_family == "Debian"
        and (k3s_expose_ingress_publicly | bool)
        and (k3s_ingress_allowed_cidrs | length > 0

# =============================================================================
# REDHAT/ROCKY/CENTOS FIREWALLD RULES
# =============================================================================
- name: Ensure firewalld is installed (RedHat)
  ansible.builtin.package:
    name: firewalld
    state: present
  when: ansible_os_family == "RedHat"

- name: Ensure firewalld is enabled and running (RedHat)
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true
  when: ansible_os_family == "RedHat"

# -----------------------------------------------------------------------------
# CREATE DEDICATED K3S-CLUSTER ZONE (Strict Node-to-Node)
# -----------------------------------------------------------------------------
- name: Create k3s-cluster zone for inter-node communication
  ansible.posix.firewalld:
    zone: k3s-cluster
    state: present
    permanent: yes
    immediate: yes
  when: ansible_os_family == "RedHat"

- name: Set k3s-cluster zone target to DROP (default deny)
  ansible.builtin.command: |
    firewall-cmd --permanent --zone=k3s-cluster --set-target=DROP
    firewall-cmd --reload
  when: ansible_os_family == "RedHat"
  changed_when: false

- name: Add node CIDRs as sources to k3s-cluster zone
  ansible.posix.firewalld:
    zone: k3s-cluster
    source: "{{ item }}"
    state: enabled
    permanent: yes
    immediate: yes
  loop: "{{ k3s_node_cidrs }}"
  when: ansible_os_family == "RedHat"

- name: Add individual node IPs to k3s-cluster zone (from inventory)
  ansible.posix.firewalld:
    zone: k3s-cluster
    source: "{{ hostvars[item].ansible_host }}/32"
    state: enabled
    permanent: yes
    immediate: yes
  loop: "{{ groups['all'] }}"
  when: ansible_os_family == "RedHat" and hostvars[item].ansible_host is defined

# -----------------------------------------------------------------------------
# K3S API SERVER (6443) - Node-to-Node + Admin Access
# -----------------------------------------------------------------------------
- name: Allow API 6443/tcp in k3s-cluster zone (node-to-node)
  ansible.posix.firewalld:
    zone: k3s-cluster
    port: 6443/tcp
    state: enabled
    permanent: yes
    immediate: yes
  when: ansible_os_family == "RedHat"

# Allow admins to access API from specific CIDRs only
- name: Allow admin CIDRs to access 6443/tcp (public zone rich rule)
  ansible.posix.firewalld:
    zone: public
    rich_rule: 'rule family="ipv4" source address="{{ item }}" port port="6443" protocol="tcp" accept'
    state: enabled
    permanent: yes
    immediate: yes
  loop: "{{ k3s_admin_cidrs }}"
  when: ansible_os_family == "RedHat" and (k3s_admin_cidrs | length) > 0

# Block 6443 from public zone if not in admin CIDRs
- name: Explicitly block 6443 in public zone (security hardening)
  ansible.posix.firewalld:
    zone: public
    rich_rule: 'rule family="ipv4" port port="6443" protocol="tcp" reject'
    state: enabled
    permanent: yes
    immediate: yes
  when: ansible_os_family == "RedHat"

# -----------------------------------------------------------------------------
# METALLB MEMBERLIST (7946) - Node-to-Node Only
# -----------------------------------------------------------------------------
- name: Allow MetalLB memberlist 7946 tcp/udp in k3s-cluster zone
  ansible.posix.firewalld:
    zone: k3s-cluster
    port: "{{ item }}"
    state: enabled
    permanent: yes
    immediate: yes
  loop: ["7946/tcp","7946/udp"]
  when: ansible_os_family == "RedHat" and (k3s_enable_metallb | bool)

- name: Allow MetalLB speaker 7472/tcp in k3s-cluster zone
  ansible.posix.firewalld:
    zone: k3s-cluster
    port: 7472/tcp
    state: enabled
    permanent: yes
    immediate: yes
  when: ansible_os_family == "RedHat" and (k3s_enable_metallb | bool)

# -----------------------------------------------------------------------------
# FLANNEL CNI - Node-to-Node Only
# -----------------------------------------------------------------------------
- name: Allow flannel vxlan 8472/udp in k3s-cluster zone
  ansible.posix.firewalld:
    zone: k3s-cluster
    port: 8472/udp
    state: enabled
    permanent: yes
    immediate: yes
  when: ansible_os_family == "RedHat" and (k3s_flannel_backend == "vxlan")

- name: Allow flannel wireguard 51820/udp in k3s-cluster zone
  ansible.posix.firewalld:
    zone: k3s-cluster
    port: 51820/udp
    state: enabled
    permanent: yes
    immediate: yes
  when: ansible_os_family == "RedHat" and (k3s_flannel_backend == "wireguard")

- name: Allow flannel wireguard IPv6 51821/udp in k3s-cluster zone
  ansible.posix.firewalld:
    zone: k3s-cluster
    port: 51821/udp
    state: enabled
    permanent: yes
    immediate: yes
  when: ansible_os_family == "RedHat" and (k3s_flannel_backend == "wireguard") and (k3s_enable_ipv6 | bool)

# -----------------------------------------------------------------------------
# KUBELET METRICS (10250) - Node-to-Node Only
# -----------------------------------------------------------------------------
- name: Allow kubelet metrics 10250/tcp in k3s-cluster zone
  ansible.posix.firewalld:
    zone: k3s-cluster
    port: 10250/tcp
    state: enabled
    permanent: yes
    immediate: yes
  when: ansible_os_family == "RedHat" and (k3s_enable_kubelet_metrics | bool)

- name: Block kubelet metrics 10250 from public zone
  ansible.posix.firewalld:
    zone: public
    rich_rule: 'rule family="ipv4" port port="10250" protocol="tcp" reject'
    state: enabled
    permanent: yes
    immediate: yes
  when: ansible_os_family == "RedHat"

# -----------------------------------------------------------------------------
# ETCD (2379-2380) - Masters Only, Node-to-Node
# -----------------------------------------------------------------------------
- name: Allow etcd 2379-2380/tcp in k3s-cluster zone (masters only)
  ansible.posix.firewalld:
    zone: k3s-cluster
    port: 2379-2380/tcp
    state: enabled
    permanent: yes
    immediate: yes
  when: ansible_os_family == "RedHat"
        and (inventory_hostname in groups['master'])
        and (k3s_enable_embedded_etcd | bool)

- name: Block etcd ports from public zone
  ansible.posix.firewalld:
    zone: public
    rich_rule: 'rule family="ipv4" port port="{{ item }}" protocol="tcp" reject'
    state: enabled
    permanent: yes
    immediate: yes
  loop: ["2379", "2380"]
  when: ansible_os_family == "RedHat"

# -----------------------------------------------------------------------------
# NODEPORTS (30000-32767) - Restricted Access
# -----------------------------------------------------------------------------
# Block NodePorts from public zone by default
- name: Block NodePort range 30000-32767 from public zone
  ansible.posix.firewalld:
    zone: public
    rich_rule: 'rule family="ipv4" port port="30000-32767" protocol="tcp" reject'
    state: enabled
    permanent: yes
    immediate: yes
  when: ansible_os_family == "RedHat" and not (k3s_expose_nodeports_publicly | default(false) | bool)

# Allow NodePorts only from admin CIDRs if needed
- name: Allow NodePorts from admin CIDRs only
  ansible.posix.firewalld:
    zone: public
    rich_rule: 'rule family="ipv4" source address="{{ item }}" port port="30000-32767" protocol="tcp" accept'
    state: enabled
    permanent: yes
    immediate: yes
  loop: "{{ k3s_admin_cidrs }}"
  when: ansible_os_family == "RedHat"
        and (k3s_allow_nodeports_from_admin | default(true) | bool)
        and (k3s_admin_cidrs | length) > 0

# -----------------------------------------------------------------------------
# INGRESS PORTS (80/443) - Controlled Public Access
# -----------------------------------------------------------------------------
- name: Allow public ingress 80/443 if enabled (unrestricted)
  ansible.posix.firewalld:
    zone: public
    port: "{{ item }}/tcp"
    state: enabled
    permanent: yes
    immediate: yes
  loop: [80, 443]
  when: ansible_os_family == "RedHat"
        and (k3s_expose_ingress_publicly | bool)
        and (k3s_ingress_allowed_cidrs | length == 0)

- name: Allow public ingress 80/443 only from allowed CIDRs (rich rules)
  ansible.posix.firewalld:
    zone: public
    rich_rule: 'rule family="ipv4" source address="{{ pair.0 }}" port port="{{ pair.1 }}" protocol="tcp" accept'
    state: enabled
    permanent: yes
    immediate: yes
  loop: "{{ k3s_ingress_allowed_cidrs | product(['80','443']) | list }}"
  loop_control:
    loop_var: pair
  when: ansible_os_family == "RedHat"
        and (k3s_expose_ingress_publicly | bool)
        and (k3s_ingress_allowed_cidrs | length > 0)

- name: Block ingress 80/443 if not publicly exposed
  ansible.posix.firewalld:
    zone: public
    rich_rule: 'rule family="ipv4" port port="{{ item }}" protocol="tcp" reject'
    state: enabled
    permanent: yes
    immediate: yes
  loop: ["80", "443"]
  when: ansible_os_family == "RedHat" and not (k3s_expose_ingress_publicly | bool)

# -----------------------------------------------------------------------------
# BLOCK SENSITIVE PORTS FROM PUBLIC ZONE
# -----------------------------------------------------------------------------
- name: Block Kubernetes internal ports from public access
  ansible.posix.firewalld:
    zone: public
    rich_rule: 'rule family="ipv4" port port="{{ item }}" protocol="tcp" reject'
    state: enabled
    permanent: yes
    immediate: yes
  loop:
    - "10251"  # kube-scheduler
    - "10252"  # kube-controller-manager
    - "10255"  # kubelet read-only
    - "10256"  # kube-proxy health
    - "9099"   # calico-felix
    - "5473"   # calico-typha
    - "8080"   # insecure api (if accidentally enabled)
    - "8443"   # alternative api
  when: ansible_os_family == "RedHat"

# Block common admin/debug ports
- name: Block administrative and debug ports from public
  ansible.posix.firewalld:
    zone: public
    rich_rule: 'rule family="ipv4" port port="{{ item }}" protocol="tcp" reject'
    state: enabled
    permanent: yes
    immediate: yes
  loop:
    - "9990"   # Generic admin consoles
    - "6444"   # K3s agent supervisor
    - "10248"  # kubelet healthz
    - "10249"  # kube-proxy metrics
    - "10257"  # kube-controller-manager
    - "10259"  # kube-scheduler
  when: ansible_os_family == "RedHat"

# -----------------------------------------------------------------------------
# POD AND SERVICE SUBNETS IN TRUSTED ZONE
# -----------------------------------------------------------------------------
- name: Allow pod subnet in the trusted zone
  ansible.posix.firewalld:
    source: 10.42.0.0/16
    zone: trusted
    state: enabled
    permanent: yes
    immediate: yes
  when: ansible_os_family == "RedHat"

- name: Allow service subnet in the trusted zone
  ansible.posix.firewalld:
    source: 10.43.0.0/16
    zone: trusted
    state: enabled
    permanent: yes
    immediate: yes
  when: ansible_os_family == "RedHat"

# -----------------------------------------------------------------------------
# SSH ACCESS RESTRICTION
# -----------------------------------------------------------------------------
- name: Allow SSH only from admin CIDRs (RedHat)
  ansible.posix.firewalld:
    zone: public
    rich_rule: 'rule family="ipv4" source address="{{ item }}" port port="22" protocol="tcp" accept'
    state: enabled
    permanent: yes
    immediate: yes
  loop: "{{ k3s_admin_cidrs }}"
  when: ansible_os_family == "RedHat" and (k3s_admin_cidrs | length) > 0

# Remove default SSH service from public zone if admin CIDRs are defined
- name: Remove default SSH service from public zone
  ansible.posix.firewalld:
    zone: public
    service: ssh
    state: disabled
    permanent: yes
    immediate: yes
  when: ansible_os_family == "RedHat" and (k3s_admin_cidrs | length) > 0

# Fallback: ensure SSH service is enabled if no admin CIDRs defined
- name: Ensure SSH service is enabled in public zone (fallback)
  ansible.posix.firewalld:
    zone: public
    service: ssh
    state: enabled
    permanent: yes
    immediate: yes
  when: ansible_os_family == "RedHat" and (k3s_admin_cidrs | length) == 0

# -----------------------------------------------------------------------------
# APPLY ALL FIREWALL CHANGES
# -----------------------------------------------------------------------------
- name: Reload firewalld to apply all changes
  ansible.builtin.systemd:
    name: firewalld
    state: reloaded
  when: ansible_os_family == "RedHat"

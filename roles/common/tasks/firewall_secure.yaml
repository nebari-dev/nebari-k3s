---
- name: Install UFW (Debian)
  ansible.builtin.package:
    name: ufw
    state: present
  when: ansible_os_family == "Debian"

- name: Enable UFW and deny incoming by default
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
  when: ansible_os_family == "Debian"

- name: Allow SSH (adjust if needed)
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
  when: ansible_os_family == "Debian"

# --- K3s API: TCP only, and restricted ---
- name: Allow API (6443/tcp) from node CIDRs
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
    to_port: "6443"
    proto: tcp
  loop: "{{ k3s_node_cidrs }}"
  when: ansible_os_family == "Debian"

- name: Allow API (6443/tcp) from admin CIDRs
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
    to_port: "6443"
    proto: tcp
  loop: "{{ k3s_admin_cidrs }}"
  when: ansible_os_family == "Debian" and (k3s_admin_cidrs | length) > 0

# --- MetalLB memberlist: node-to-node only ---
- name: Allow MetalLB memberlist (7946/tcp+udp) node-to-node
  community.general.ufw:
    rule: allow
    from_ip: "{{ item.0 }}"
    to_port: "7946"
    proto: "{{ item.1 }}"
  loop: "{{ k3s_node_cidrs | product(['tcp','udp']) | list }}"
  when: ansible_os_family == "Debian" and (k3s_enable_metallb | bool)

# --- Flannel backend ports: node-to-node only ---
- name: Allow flannel vxlan (8472/udp) node-to-node
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
    to_port: "8472"
    proto: udp
  loop: "{{ k3s_node_cidrs }}"
  when: ansible_os_family == "Debian" and (k3s_flannel_backend == "vxlan")

- name: Allow flannel wireguard (51820/udp) node-to-node
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
    to_port: "51820"
    proto: udp
  loop: "{{ k3s_node_cidrs }}"
  when: ansible_os_family == "Debian" and (k3s_flannel_backend == "wireguard")

- name: Allow flannel wireguard IPv6 (51821/udp) node-to-node
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
    to_port: "51821"
    proto: udp
  loop: "{{ k3s_node_cidrs }}"
  when: ansible_os_family == "Debian" and (k3s_flannel_backend == "wireguard") and (k3s_enable_ipv6 | bool)

# --- Kubelet metrics: node-to-node only (optional) ---
- name: Allow kubelet metrics (10250/tcp) node-to-node
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
    to_port: "10250"
    proto: tcp
  loop: "{{ k3s_node_cidrs }}"
  when: ansible_os_family == "Debian" and (k3s_enable_kubelet_metrics | bool)

# --- Optional public ingress ---
- name: Allow ingress 80/443 if public exposure is enabled (unrestricted)
  community.general.ufw:
    rule: allow
    to_port: "{{ item }}"
    proto: tcp
  loop: ["80","443"]
  when: ansible_os_family == "Debian"
        and (k3s_expose_ingress_publicly | bool)
        and (k3s_ingress_allowed_cidrs | length == 0)

- name: Allow ingress 80/443 only from allowed CIDRs
  community.general.ufw:
    rule: allow
    from_ip: "{{ pair.0 }}"
    to_port: "{{ pair.1 }}"
    proto: tcp
  loop: "{{ k3s_ingress_allowed_cidrs | product(['80','443']) | list }}"
  loop_control:
    loop_var: pair
  when: ansible_os_family == "Debian"
        and (k3s_expose_ingress_publicly | bool)
        and (k3s_ingress_allowed_cidrs | length > 0

---
- name: Ensure firewalld is installed (RedHat)
  ansible.builtin.package:
    name: firewalld
    state: present
  when: ansible_os_family == "RedHat"

- name: Ensure firewalld is enabled and running (RedHat)
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true
  when: ansible_os_family == "RedHat"

- name: Create k3s-internal zone
  ansible.posix.firewalld:
    zone: k3s-internal
    state: present
    permanent: yes
    immediate: yes
  when: ansible_os_family == "RedHat"

- name: Add node CIDRs as sources to k3s-internal
  ansible.posix.firewalld:
    zone: k3s-internal
    source: "{{ item }}"
    state: enabled
    permanent: yes
    immediate: yes
  loop: "{{ k3s_node_cidrs }}"
  when: ansible_os_family == "RedHat"

# K3s API: allow node-to-node internally
- name: Allow API 6443/tcp in k3s-internal
  ansible.posix.firewalld:
    zone: k3s-internal
    port: 6443/tcp
    state: enabled
    permanent: yes
    immediate: yes
  when: ansible_os_family == "RedHat"

# Allow admins to hit API (rich rules on public)
- name: Allow admin CIDRs to access 6443/tcp (public zone rich rule)
  ansible.posix.firewalld:
    zone: public
    rich_rule: 'rule family="ipv4" source address="{{ item }}" port port="6443" protocol="tcp" accept'
    state: enabled
    permanent: yes
    immediate: yes
  loop: "{{ k3s_admin_cidrs }}"
  when: ansible_os_family == "RedHat" and (k3s_admin_cidrs | length) > 0

# MetalLB memberlist node-to-node only
- name: Allow MetalLB memberlist 7946 tcp/udp internal
  ansible.posix.firewalld:
    zone: k3s-internal
    port: "{{ item }}"
    state: enabled
    permanent: yes
    immediate: yes
  loop: ["7946/tcp","7946/udp"]
  when: ansible_os_family == "RedHat" and (k3s_enable_metallb | bool)

# Flannel backend
- name: Allow flannel vxlan 8472/udp internal
  ansible.posix.firewalld:
    zone: k3s-internal
    port: 8472/udp
    state: enabled
    permanent: yes
    immediate: yes
  when: ansible_os_family == "RedHat" and (k3s_flannel_backend == "vxlan")

- name: Allow flannel wireguard 51820/udp internal
  ansible.posix.firewalld:
    zone: k3s-internal
    port: 51820/udp
    state: enabled
    permanent: yes
    immediate: yes
  when: ansible_os_family == "RedHat" and (k3s_flannel_backend == "wireguard")

- name: Allow flannel wireguard IPv6 51821/udp internal
  ansible.posix.firewalld:
    zone: k3s-internal
    port: 51821/udp
    state: enabled
    permanent: yes
    immediate: yes
  when: ansible_os_family == "RedHat" and (k3s_flannel_backend == "wireguard") and (k3s_enable_ipv6 | bool)

# kubelet metrics
- name: Allow kubelet metrics 10250/tcp internal
  ansible.posix.firewalld:
    zone: k3s-internal
    port: 10250/tcp
    state: enabled
    permanent: yes
    immediate: yes
  when: ansible_os_family == "RedHat" and (k3s_enable_kubelet_metrics | bool)

# etcd (masters only) internal only
- name: Allow etcd 2379-2380/tcp internal (masters only)
  ansible.posix.firewalld:
    zone: k3s-internal
    port: 2379-2380/tcp
    state: enabled
    permanent: yes
    immediate: yes
  when: ansible_os_family == "RedHat"
        and (inventory_hostname in groups['master'])
        and (k3s_enable_embedded_etcd | bool)

# Optional public ingress
- name: Allow public ingress 80/443 if enabled
  ansible.posix.firewalld:
    zone: public
    port: "{{ item }}/tcp"
    state: enabled
    permanent: yes
    immediate: yes
  loop: [80, 443]
  when: ansible_os_family == "RedHat"
        and (k3s_expose_ingress_publicly | bool)
        and (k3s_ingress_allowed_cidrs | length == 0)

- name: Allow public ingress 80/443 only from allowed CIDRs (rich rules)
  ansible.posix.firewalld:
    zone: public
    rich_rule: 'rule family="ipv4" source address="{{ pair.0 }}" port port="{{ pair.1 }}" protocol="tcp" accept'
    state: enabled
    permanent: yes
    immediate: yes
  loop: "{{ k3s_ingress_allowed_cidrs | product(['80','443']) | list }}"
  loop_control:
    loop_var: pair
  when: ansible_os_family == "RedHat"
        and (k3s_expose_ingress_publicly | bool)
        and (k3s_ingress_allowed_cidrs | length > 0)

# Keep these if you want (K3s docs recommend)
- name: Allow pod subnet in the trusted zone
  ansible.posix.firewalld:
    source: 10.42.0.0/16
    zone: trusted
    state: enabled
    permanent: yes
    immediate: yes
  when: ansible_os_family == "RedHat"

- name: Allow service subnet in the trusted zone
  ansible.posix.firewalld:
    source: 10.43.0.0/16
    zone: trusted
    state: enabled
    permanent: yes
    immediate: yes
  when: ansible_os_family == "RedHat"

---
- name: Gather facts
  ansible.builtin.setup:

- name: Ensure flannel interface exists
  ansible.builtin.command: "ip link show {{ flannel_iface }}"
  changed_when: false

- name: Read flannel interface IPv4 CIDR
  ansible.builtin.shell: >-
    ip -4 addr show {{ flannel_iface }} | awk '/inet / {print $2}' | head -n1
  args:
    executable: /bin/bash
  register: flannel_iface_cidr
  changed_when: false

- name: Fail if no IPv4 on flannel interface
  ansible.builtin.fail:
    msg: "Interface {{ flannel_iface }} has no IPv4 address; cannot proceed safely."
  when: flannel_iface_cidr.stdout | length == 0

- name: Set node IPv4 facts
  ansible.builtin.set_fact:
    k3s_node_ipv4_cidr: "{{ flannel_iface_cidr.stdout }}"
    k3s_node_ipv4: "{{ flannel_iface_cidr.stdout.split('/')[0] }}"

- name: Validate node CIDRs are set
  ansible.builtin.fail:
    msg: "k3s_node_cidrs must be set explicitly (e.g. ['192.168.10.0/24'])."
  when: k3s_node_cidrs is not defined or (k3s_node_cidrs | length) == 0

- name: Validate apiserver_endpoint format
  ansible.builtin.assert:
    that:
      - apiserver_endpoint is match("^(\\d{1,3}\\.){3}\\d{1,3}$")
    fail_msg: "apiserver_endpoint must be an IPv4 like 192.168.10.222"

- name: Validate MetalLB range format
  ansible.builtin.assert:
    that:
      - metal_lb_ip_range is match("^(\\d{1,3}\\.){3}\\d{1,3}-(\\d{1,3}\\.){3}\\d{1,3}$")
    fail_msg: "metal_lb_ip_range must look like '192.168.10.191-192.168.10.199'"
  when: k3s_enable_metallb | bool

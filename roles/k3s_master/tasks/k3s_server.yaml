# /roles/k3s_master/tasks/k3s_server.yaml
---
- name: Get IPv4 address of the flannel interface
  shell: >-
    ip -4 addr show {{ flannel_iface }} | grep -oP '(?<=inet\s)\d+(\.\d+){3}'
  register: master_ip
  delegate_to: "{{ groups['master'][0] }}"
  changed_when: false

- name: Debug master IP
  debug:
    msg: "{{ master_ip.stdout }}"
  when: master_ip is defined

- name: Set master_ip fact
  set_fact:
    master_ip: "{{ master_ip.stdout }}"
  when: master_ip is defined

# ============================================
# IDEMPOTENCY: Check if k3s is already installed and running
# ============================================
- name: Check if k3s binary exists
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Check if k3s service exists
  ansible.builtin.systemd:
    name: k3s
  register: k3s_service
  failed_when: false
  when: k3s_binary.stat.exists

- name: Check k3s version if installed
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: k3s_current_version
  changed_when: false
  failed_when: false
  when: k3s_binary.stat.exists

- name: Display current k3s status
  ansible.builtin.debug:
    msg: |
      k3s installed: {{ k3s_binary.stat.exists }}
      {% if k3s_binary.stat.exists %}
      Current version: {{ k3s_current_version.stdout_lines[0] | default('unknown') }}
      Service active: {{ k3s_service.status.ActiveState | default('unknown') }}
      {% endif %}
      Target version: {{ k3s_version }}
  when: k3s_binary.stat.exists

# Download install script (always, it's a small script)
- name: Download k3s installation script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/install_k3s.sh
    mode: "u=rwx,g=rx,o=rx"

# Only install/upgrade if needed
- name: Install or upgrade k3s server
  ansible.builtin.command: /tmp/install_k3s.sh server {{ server_init_args }}
  args:
    chdir: /tmp
  register: k3s_server
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  when: >
    not k3s_binary.stat.exists or
    (k3s_current_version.stdout is defined and k3s_version not in k3s_current_version.stdout)

- name: Wait for k3s service to be running
  command: systemctl is-active k3s
  register: k3s_status
  retries: 10
  delay: 5
  until: k3s_status.stdout == "active"

# check if current node has joined the cluster
- name: Check if node has joined the cluster
  command: "{{ k3s_binary_path | default('k3s') }} kubectl get nodes -o=jsonpath='{.items[*].metadata.name}'"
  register: nodes
  retries: 10
  delay: 5
  until: nodes.rc == 0 and inventory_hostname in nodes.stdout
  when: inventory_hostname in groups['master']

- name: Create directory .kube
  file:
    path: ~{{ ansible_user }}/.kube
    state: directory
    owner: "{{ ansible_user }}"
    mode: "u=rwx,g=rx,o="

- name: Copy config file to user home directory
  copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: ~{{ ansible_user }}/.kube/config
    remote_src: yes
    owner: "{{ ansible_user }}"
    mode: "u=rw,g=,o="

- name: Replace cluster address with kube-vip address (apiserver_endpoint)
  ansible.builtin.replace:
    path: "~{{ ansible_user }}/.kube/config"
    regexp: '^(\s*server:\s+)https://.*'
    replace: '\1https://{{ apiserver_endpoint }}:6443'
    backup: yes

- name: Wait for node-token (first master)
  ansible.builtin.wait_for:
    path: /var/lib/rancher/k3s/server/node-token
  when: inventory_hostname == groups['master'][0]

- name: Read node-token (first master) without changing perms
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: node_token
  become: true
  when: inventory_hostname == groups['master'][0]
  no_log: true

- name: Store cluster token fact for other tasks if needed
  ansible.builtin.set_fact:
    token: "{{ node_token.content | b64decode | regex_replace('\n', '') }}"
  when: inventory_hostname == groups['master'][0]
  no_log: true

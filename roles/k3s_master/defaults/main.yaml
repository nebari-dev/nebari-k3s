---
ansible_user: ansible


#################################
# K3s
#################################

k3s_server_location: /var/lib/rancher/k3s
k3s_binary_path: /usr/local/bin/k3s

k3s_version: v1.30.2+k3s2
# k3s_token is required  masters can talk together securely
# this token should be alpha numeric only
k3s_token: some-secret-password

# change these to your liking, the only required are: --disable servicelb, --tls-san {{ apiserver_endpoint }}
extra_server_args: >-
  --tls-san {{ apiserver_endpoint }}
  --disable servicelb
  --disable traefik
  --write-kubeconfig-mode 644
  --flannel-iface={{ flannel_iface }}

# BY default if --cluster-init is not given to any of the master nodes, k3s assumes a
# single-node kube cluster
server_init_args: >-
  {% if groups['master'] | length > 1 %}
    {% if inventory_hostname == groups['master'][0] %}
      --cluster-init
    {% else %}
      --server https://{{ master_ip | default('') }}:6443
    {% endif %}
  {% endif %}
  --token {{ k3s_token }}
  {{ extra_server_args }}

# interface which will be used for flannel
flannel_iface: eth1 # (vagrant uses eth1)

#################################
# k9s (optional)
#################################

# Install the k9s TUI binary on the first master. Off by default; opt in with
# install_k9s: true (or -e install_k9s=true).
install_k9s: false
k9s_version: v0.32.7

#################################
# kube-vip (optional)
#################################

# Deploy kube-vip (control-plane VIP). Off by default; opt in with
# install_kube_vip: true (requires a free VIP set in apiserver_endpoint). For a
# single master, leave off and point apiserver_endpoint at the master's node IP.
install_kube_vip: false

# enable kube-vip ARP broadcasts
kube_vip_arp: true
kube_vip_interface: ens5

# apiserver_endpoint is virtual ip-address which will be configured on each master
apiserver_endpoint: 192.168.10.222


# image tag for kube-vip
kube_vip_tag_version: v0.8.2


#################################
# MetalLB (optional)
#################################

# Deploy MetalLB for LoadBalancer IPs. Off by default; opt in with
# install_metallb: true (needs a free range in metal_lb_ip_range). If off, keep
# k3s servicelb enabled (don't pass --disable servicelb) to get LoadBalancer IPs
# on the node addresses.
install_metallb: false

# metallb type frr or native
metal_lb_type: native
# metallb mode layer2 or bgp
metal_lb_mode: layer2

# image tag for metal lb
metal_lb_tag_version: v0.14.8

# metallb ip range for load balancer
metal_lb_ip_range: 192.168.10.191-192.168.10.199

name: vagrant-ha-security

on:
  workflow_dispatch: {}

  push:
    branches-ignore:
      - main

  pull_request:
    branches-ignore:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  vagrant-tests:
    if: ${{ github.event_name != 'pull_request' || github.head_ref != 'main' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [rocky9, ubuntu]

    steps:
      - uses: actions/checkout@v4

      - name: Show environment
        run: |
          set -euxo pipefail
          uname -a
          ruby -v || true

      - name: Install Vagrant (HashiCorp repo)
        run: |
          set -euxo pipefail
          sudo apt-get update -y
          sudo apt-get install -y wget gpg lsb-release ca-certificates

          wget -O- https://apt.releases.hashicorp.com/gpg \
            | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg

          CODENAME="$(. /etc/os-release && echo "${VERSION_CODENAME}")"
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com ${CODENAME} main" \
            | sudo tee /etc/apt/sources.list.d/hashicorp.list

          sudo apt-get update -y
          sudo apt-get install -y vagrant
          vagrant --version

      - name: Install virtualization + build deps (libvirt)
        run: |
          set -euxo pipefail
          sudo apt-get update -y
          sudo apt-get install -y \
            qemu-kvm libvirt-daemon-system libvirt-clients dnsmasq-base \
            nmap \
            # needed to build vagrant-libvirt native extensions
            libvirt-dev pkg-config \
            ruby-dev gcc g++ make \
            libxml2-dev libxslt1-dev zlib1g-dev

          sudo systemctl enable --now libvirtd

          # permissions (best effort; GH runner user is ephemeral)
          sudo usermod -aG libvirt,kvm "$USER" || true

      - name: Install Vagrant plugins
        run: |
          set -euxo pipefail
          vagrant plugin install vagrant-libvirt

      - name: Platform env (detect + export)
        shell: bash
        run: |
          set -euxo pipefail
          source tests/bin/env.sh
          echo "PROVIDER=${PROVIDER}"
          echo "ROCKY_BOX_NAME=${ROCKY_BOX_NAME:-}"
          echo "ROCKY_BOX_URL=${ROCKY_BOX_URL:-}"

      - name: Validate Vagrantfile
        run: |
          set -euxo pipefail
          cd tests/${{ matrix.platform }}
          vagrant validate

      - name: Install Ansible
        run: |
          set -euxo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ansible

      - name: Bring up cluster + run Ansible + security scans
        shell: bash
        run: |
          set -euxo pipefail
          source tests/bin/env.sh

          cd tests/${{ matrix.platform }}

          # Rocky: ensure box exists (env.sh provides URL)
          if [[ "${{ matrix.platform }}" == "rocky9" ]]; then
            vagrant box add --name "${ROCKY_BOX_NAME}" "${ROCKY_BOX_URL}" --provider=libvirt || true
          fi

          vagrant up --provider="${PROVIDER}"

          cd -  # repo root

          ansible-playbook -i tests/${{ matrix.platform }}/inventories/hosts.ini playbook.yaml

          bash tests/bin/security-scan.sh tests/${{ matrix.platform }}/inventories/hosts.ini

      - name: Cleanup VMs (always)
        if: always()
        run: |
          set -euxo pipefail
          cd tests/${{ matrix.platform }}
          vagrant destroy -f || true

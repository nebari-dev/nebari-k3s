name: vagrant-ha-security

on:
  workflow_dispatch: {}

  push:
    branches-ignore:
      - main

  pull_request:
    branches-ignore:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  vagrant-tests:
    if: ${{ github.event_name != 'pull_request' || github.head_ref != 'main' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [rocky9, ubuntu]

    steps:
      - uses: actions/checkout@v4

      - name: Show environment
        run: |
          set -euxo pipefail
          uname -a
          ruby -v || true

      - name: Install Vagrant (HashiCorp repo)
        run: |
          set -euxo pipefail
          sudo apt-get update -y
          sudo apt-get install -y wget gpg lsb-release ca-certificates

          wget -O- https://apt.releases.hashicorp.com/gpg \
            | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg

          CODENAME="$(. /etc/os-release && echo "${VERSION_CODENAME}")"
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com ${CODENAME} main" \
            | sudo tee /etc/apt/sources.list.d/hashicorp.list

          sudo apt-get update -y
          sudo apt-get install -y vagrant
          vagrant --version

      - name: Install virtualization + build deps (libvirt)
        run: |
          set -euxo pipefail
          sudo apt-get update -y
          # Install libvirt and build deps for vagrant-libvirt native extensions
          sudo apt-get install -y \
            qemu-kvm libvirt-daemon-system libvirt-clients dnsmasq-base \
            nmap \
            libvirt-dev pkg-config \
            ruby-dev gcc g++ make \
            libxml2-dev libxslt1-dev zlib1g-dev

          sudo systemctl enable --now libvirtd

          # Add user to groups
          sudo usermod -aG libvirt,kvm "$USER"

          # Fix socket permissions for CI environment
          sudo chmod 666 /var/run/libvirt/libvirt-sock || true
          sudo chmod 666 /var/run/libvirt/libvirt-sock-ro || true

      - name: Install Vagrant plugins
        run: |
          set -euxo pipefail
          vagrant plugin install vagrant-libvirt

      - name: Platform env (detect + export)
        shell: bash
        run: |
          set -euxo pipefail
          source tests/bin/env.sh
          echo "PROVIDER=${PROVIDER}"
          echo "ROCKY_BOX_NAME=${ROCKY_BOX_NAME:-}"
          echo "ROCKY_BOX_URL=${ROCKY_BOX_URL:-}"

      - name: Validate Vagrantfile
        run: |
          set -euxo pipefail
          cd tests/${{ matrix.platform }}
          vagrant validate

      - name: Install Ansible
        run: |
          set -euxo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ansible

      - name: Install security scanning tools
        run: |
          set -euxo pipefail
          # Install jq for JSON parsing
          sudo apt-get install -y jq netcat-openbsd

          # Install kube-bench for CIS Kubernetes Benchmark
          wget -q https://github.com/aquasecurity/kube-bench/releases/download/v0.7.1/kube-bench_0.7.1_linux_amd64.tar.gz
          tar -xzf kube-bench_0.7.1_linux_amd64.tar.gz
          sudo mv kube-bench /usr/local/bin/
          sudo chmod +x /usr/local/bin/kube-bench

          # Install trivy for vulnerability scanning
          wget -q https://github.com/aquasecurity/trivy/releases/download/v0.48.0/trivy_0.48.0_Linux-64bit.tar.gz
          tar -xzf trivy_0.48.0_Linux-64bit.tar.gz
          sudo mv trivy /usr/local/bin/
          sudo chmod +x /usr/local/bin/trivy

          # Verify installations
          kube-bench version || echo "kube-bench installed"
          trivy --version
          nmap --version

      - name: Bring up cluster + run Ansible + security scans
        shell: bash
        run: |
          set -euxo pipefail
          source tests/bin/env.sh

          cd tests/${{ matrix.platform }}

          # Rocky: ensure box exists (env.sh provides URL)
          if [[ "${{ matrix.platform }}" == "rocky9" ]]; then
            vagrant box add --name "${ROCKY_BOX_NAME}" "${ROCKY_BOX_URL}" --provider=libvirt || true
          fi

          # Use sg to run with libvirt group active
          sg libvirt -c "vagrant up --provider=${PROVIDER}"

          cd -  # repo root

          ansible-playbook -i tests/${{ matrix.platform }}/inventories/hosts.ini playbook.yaml

          bash tests/bin/security-scan.sh tests/${{ matrix.platform }}/inventories/hosts.ini

      - name: Run comprehensive security test suite
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          cd tests/security-suite

          # Run security tests in quick mode to avoid timeouts
          bash run-security-tests.sh \
            --inventory ../tests/${{ matrix.platform }}/inventories/hosts.ini \
            --output-dir ../../reports/${{ matrix.platform }} \
            --quick \
            --verbose || true

          # Display summary
          if [[ -f ../../reports/${{ matrix.platform }}/security-report.json ]]; then
            echo "Security scan completed. Report generated:"
            jq -r '.summary' ../../reports/${{ matrix.platform }}/security-report.json || true
          fi

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ matrix.platform }}-${{ github.run_number }}
          path: |
            reports/${{ matrix.platform }}/**
            tests/bin/security-scan-*.log
          retention-days: 30

      - name: Cleanup VMs (always)
        if: always()
        run: |
          set -euxo pipefail
          cd tests/${{ matrix.platform }}
          sg libvirt -c "vagrant destroy -f" || true

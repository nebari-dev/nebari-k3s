name: vagrant-ha-security

on:
  workflow_dispatch: {}

  push:
    branches-ignore:
      - main

  pull_request:
    branches-ignore:
      - main

concurrency:
  # One running workflow per branch/PR ref; new events cancel older in-progress runs
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  vagrant-tests:
    if: ${{ github.event_name != 'pull_request' || github.head_ref != 'main' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        platform: [rocky9, ubuntu]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Show environment
        run: |
          uname -a
          ruby -v || true
          vagrant --version || true

      # -------- Linux: full run with libvirt  --------
      - name: Install virtualization deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y qemu-kvm libvirt-daemon-system libvirt-clients virt-manager dnsmasq-base nmap
          sudo usermod -aG libvirt $USER || true
          sudo systemctl enable --now libvirtd

          # Install Vagrant (if not present)
          if ! command -v vagrant >/dev/null 2>&1; then
            sudo apt-get install -y vagrant
          fi

          vagrant plugin install vagrant-libvirt

      - name: Platform env (prints what will be used)
        run: |
          bash tests/bin/env.sh

      - name: Validate Vagrantfile
        run: |
          cd tests/${{ matrix.platform }}
          vagrant validate

      - name: Bring up cluster + run Ansible + security scans (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euxo pipefail
          source tests/bin/env.sh

          cd tests/${{ matrix.platform }}

          # For Rocky, add the correct box URL (from env.sh)
          if [[ "${{ matrix.platform }}" == "rocky9" ]]; then
            vagrant box add --name "${ROCKY_BOX_NAME}" "${ROCKY_BOX_URL}" --provider=libvirt || true
          fi

          vagrant up --provider="${PROVIDER}"

          cd -
          ansible-playbook -i tests/${{ matrix.platform }}/inventories/hosts.ini playbook.yaml
          bash tests/bin/security-scan.sh tests/${{ matrix.platform }}/inventories/hosts.ini
